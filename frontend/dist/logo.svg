<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" fill="none">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBFBFB"/>
      <stop offset="50%" stop-color="#D2D3D5"/>
      <stop offset="100%" stop-color="#9E9FA1"/>
    </linearGradient>
    <linearGradient id="silverGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E9FA1"/>
      <stop offset="50%" stop-color="#D2D3D5"/>
      <stop offset="100%" stop-color="#FBFBFB"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#816D4B"/>
      <stop offset="40%" stop-color="#B89B64"/>
      <stop offset="100%" stop-color="#816D4B"/>
    </linearGradient>
  </defs>
  
  <!-- Abstract curved architectural lines (book/building pages) -->
  <g transform="translate(200, 90)">
    <!-- Outermost curve -->
    <path d="M-70,50 Q-70,-60 0,-70 Q70,-60 70,50" stroke="url(#silverGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Second curve -->
    <path d="M-52,50 Q-52,-45 0,-55 Q52,-45 52,50" stroke="url(#silverGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Third curve -->
    <path d="M-35,50 Q-35,-30 0,-40 Q35,-30 35,50" stroke="url(#silverGrad2)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Fourth curve -->
    <path d="M-20,50 Q-20,-15 0,-25 Q20,-15 20,50" stroke="url(#silverGrad2)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Center line -->
    <path d="M0,-12 L0,50" stroke="#FBFBFB" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Gold accent lines -->
  <line x1="120" y1="155" x2="280" y2="155" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="161" x2="260" y2="161" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Company name -->
  <text x="200" y="195" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="28" font-weight="600" letter-spacing="6" fill="url(#silverGrad)">MENDONÇA</text>
  <text x="200" y="225" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="28" font-weight="600" letter-spacing="6" fill="url(#silverGrad)">GALVÃO</text>

  <!-- Subtitle -->
  <text x="200" y="252" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-size="11" letter-spacing="4" fill="#9E9FA1">CONTADORES ASSOCIADOS</text>
</svg>
