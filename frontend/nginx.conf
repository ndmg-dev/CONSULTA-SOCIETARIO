server {
    listen 80;
    server_name localhost;

    # Serve os arquivos estáticos do React (Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Tratamento para SPA (Single Page Application) do React Router
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para as requisições da API irem para o Backend (FastAPI)
    location /api/ {
        # O endereço "backend" será resolvido pelo Docker DNS (definido no docker-compose)
        proxy_pass http://backend:8000/api/;
        
        # Headers necessários para encaminhar informações corretas do cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
